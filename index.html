<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <title>Project: Rock Paper Scissors</title>
  <script src="https://kit.fontawesome.com/fb818a8571.js" crossorigin="anonymous"></script>

</head>

<body class="bg-secondary">
  <div class="container">
    <h1 class="heading">
      <span id="rock">Rock</span>
      <br> <span id="paper">Paper</span> <br>
      <span id="scissors">Scissors</span>
    </h1>

    <section class="score-boardContainer">
      <div class="round"></div>
      <div class="score-board">
        <div id="playerScore">
          <h2 id="score-title">Player</h2>
          <p id="score">0</p>
        </div>
        <div id="computerScore">
          <h2 id="score-title">Computer</h2>
          <p id="score">0</p>
        </div>
      </div>
    </section>

    <section class="game-icons">
      <div class="game-iconsContainer">
        <div class="icon-item" id="rock-icon">
          <i class="fa-solid fa-hand-fist"></i>
        </div>
        <div class="icon-item" id="paper-icon">
          <i class="fa-solid fa-hand"></i>
        </div>
        <div class="icon-item" id="scissors-icon">
          <i class="fa-solid fa-hand-scissors fa-rotate-90"></i>
        </div>
      </div>
      <div class="choice">
        <p id="playerChoice">
        </p>
        <p id="computerChoice">
        </p>
      </div>
      <button onclick="switchAttribute()" id="start" type="button">start</button>
    </section>

    <section class="gameMessageContainer">
      <p></p>
      <p></p>
    </section>

    <aside class="gameStatus">
      <p></p>
      <p></p>
    </aside>


  </div>



  <script src="./index.js"></script>
</body>

</html>
