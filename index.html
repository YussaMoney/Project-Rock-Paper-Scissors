<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/fb818a8571.js" crossorigin="anonymous"></script>
  <title>Project: Rock Paper Scissors</title>

</head>

<body class="bg-secondary">
  <div class="container">
    <h1 class="heading">
      <span id="rock">Rock</span>
      <br> <span id="paper">Paper</span> <br>
      <span id="scissors">Scissors</span>
    </h1>

    <section class="game-icons">
      <div class="game-iconsContainer">
        <div class="icon-item" id="rock-icon">
          <i class="fa-solid fa-hand-fist"></i>
        </div>
        <div class="icon-item" id="paper-icon">
          <i class="fa-solid fa-hand"></i>
        </div>
        <div class="icon-item" id="scissors-icon">
          <i class="fa-solid fa-hand-scissors fa-rotate-90"></i>
        </div>
      </div>
    </section>


  </div>



  <!-- <script src="./index.js"></script> -->
</body>

</html>
